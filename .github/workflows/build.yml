name: Build APK
on:
  push:
    branches:
      - main
  workflow_dispatch: # Elle tetiklemek için buton ekler

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build APK with Flet
        uses: flet-dev/build-flet-app-action@v1
        with:
          target: apk
          project: .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flet-app-apk
          path: build/apk/*.apk
